<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK Pizza & Ice Bar POS</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#172033}.login{min-height:100vh;display:grid;place-items:center}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 5px 20px #00000008}.login .card{width:min(380px,90vw)}input,select,textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #d1d5db;border-radius:9px;box-sizing:border-box}button{border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:650}.primary{background:#e11d48;color:#fff}.dark{background:#172033;color:#fff}.muted{color:#64748b}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:22px}.side h2{margin:0 0 5px}.side small{color:#94a3b8}.side button{display:block;width:100%;margin-top:8px;background:transparent;color:#cbd5e1;text-align:left}.side button.active,.side button:hover{background:#253047;color:white}.main{padding:24px;max-width:1450px;width:100%;box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:13px;padding:15px}.stat strong{display:block;font-size:23px;margin-top:5px}.layout{display:grid;grid-template-columns:1fr 390px;gap:18px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.product{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px;cursor:pointer}.product:hover{border-color:#e11d48}.price{font-size:19px;font-weight:800;margin-top:10px}.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:11px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.order{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:15px;margin-bottom:10px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef2ff;font-size:12px}.hidden{display:none}.error{color:#b91c1c;margin-top:8px}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:2}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><div id="root"></div><script>
const API='/api';let token=localStorage.mkToken||'',me=JSON.parse(localStorage.mkUser||'null'),products=[],cart=[],method='cash';const root=document.getElementById('root');const money=n=>'Rs '+Number(n||0).toLocaleString('en-PK');
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(o.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function login(){root.innerHTML=`<div class="login"><div class="card"><h1>MK Pizza & Ice Bar</h1><p class="muted">POS & Order Management</p><input id="u" placeholder="Username" value="admin"><input id="pw" type="password" placeholder="Password" value="admin123"><button class="primary" style="width:100%;margin-top:8px" onclick="doLogin()">Sign in</button><div id="err" class="error"></div><p class="muted">Admin: admin / admin123<br>Waiter: waiter / waiter123<br>Kitchen: kitchen / kitchen123<br>Cashier: cashier / cashier123</p></div></div>`}async function doLogin(){try{const d=await api('/login',{method:'POST',body:JSON.stringify({username:u.value,password:pw.value})});token=d.token;me=d.user;localStorage.mkToken=token;localStorage.mkUser=JSON.stringify(me);render()}catch(e){err.textContent=e.message}}
function render(){if(!token||!me)return login();root.innerHTML=`<div class="app"><aside class="side"><h2>MK Pizza</h2><small>Ice Bar • Bhakkar</small><hr><button class="active" onclick="home()">⌂ Dashboard</button>${me.role==='waiter'||me.role==='admin'?'<button onclick="newOrder()">＋ New Order</button>':''}<button onclick="orders()">▣ Orders</button>${me.role==='admin'?'<button onclick="productsPage()">▦ Products</button><button onclick="settings()">⚙ Settings</button>':''}<button onclick="logout()">↪ Logout</button></aside><main class="main" id="view"></main></div>`;home()}
async function home(){let d={salesToday:0,ordersToday:0,pending:0,kitchen:0,ready:0,products:0,lowStock:0};try{if(['admin','cashier'].includes(me.role))d=await api('/dashboard')}catch{}view.innerHTML=`<div class="top"><div><h1>${me.role[0].toUpperCase()+me.role.slice(1)} Dashboard</h1><span class="muted">${me.name} • MK Pizza & Ice Bar</span></div></div>${['admin','cashier'].includes(me.role)?`<div class="stats"><div class="stat"><small>Sales Today</small><strong>${money(d.salesToday)}</strong></div><div class="stat"><small>Orders</small><strong>${d.ordersToday}</strong></div><div class="stat"><small>Awaiting Approval</small><strong>${d.pending}</strong></div><div class="stat"><small>Kitchen</small><strong>${d.kitchen}</strong></div><div class="stat"><small>Ready</small><strong>${d.ready}</strong></div></div>`:''}<div class="panel"><h2>Workflow</h2><p>Waiter / Online → <b>Admin authorization</b> → Kitchen → Ready → Cashier collects payment → Closed.</p><button class="primary" onclick="orders()">Open Orders</button></div>`}
async function newOrder(){products=await api('/products');view.innerHTML=`<div class="top"><h1>New Order</h1><button onclick="orders()">Orders</button></div><div class="layout"><div class="panel"><input id="search" placeholder="Search pizza, burger, SKU..." oninput="renderProducts()"><div id="plist" class="products"></div></div><div class="panel"><h2>Order</h2><input id="table" placeholder="Table / Customer name"><select id="otype"><option value="dine-in">Dine-in</option><option value="takeaway">Takeaway</option><option value="delivery">Delivery</option></select><textarea id="note" placeholder="Special instructions"></textarea><div id="cart"></div><h2 id="sum">Total: Rs 0</h2><select id="pay"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile">Mobile</option></select><button class="primary" style="width:100%;margin-top:10px" onclick="place()">Send for Admin Authorization</button></div></div>`;renderProducts();renderCart()}
function renderProducts(){const q=(search?.value||'').toLowerCase();plist.innerHTML=products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q)).map(p=>`<div class="product" onclick="add('${p.id}')"><b>${p.name}</b><small class="muted">${p.category} • ${p.stock} stock</small><div class="price">${money(p.price)}</div></div>`).join('')}
function add(id){const p=products.find(x=>x.id===id);let x=cart.find(i=>i.productId===id);if(x)x.qty++;else cart.push({productId:id,qty:1});renderCart()}function renderCart(){document.getElementById('cart').innerHTML=cart.map(i=>{const p=products.find(x=>x.id===i.productId);return `<div class="cartrow"><span>${p.name}</span><span><button onclick="qty('${p.id}',-1)">−</button> ${i.qty} <button onclick="qty('${p.id}',1)">+</button></span><b>${money(p.price*i.qty)}</b></div>`}).join('')||'<p class="muted">No items</p>';if(document.getElementById('sum'))sum.textContent='Total: '+money(cart.reduce((s,i)=>s+products.find(p=>p.id===i.productId).price*i.qty,0))}function qty(id,n){let x=cart.find(i=>i.productId===id);x.qty+=n;if(x.qty<1)cart=cart.filter(i=>i!==x);renderCart()}
async function place(){if(!cart.length)return alert('Add items');try{const o=await api('/orders',{method:'POST',body:JSON.stringify({items:cart,paymentMethod:pay.value,table:table.value,orderType:otype.value,note:note.value})});alert(o.number+' sent for authorization');cart=[];orders()}catch(e){alert(e.message)}}
async function orders(){const os=await api('/orders');view.innerHTML=`<div class="top"><h1>Orders</h1>${me.role==='waiter'?'<button class="primary" onclick="newOrder()">New Order</button>':''}</div>${os.map(orderCard).join('')||'<div class="panel">No orders.</div>'}`;}
function orderCard(o){let buttons='';if(me.role==='admin'&&['pending','awaiting_authorization'].includes(o.status))buttons='<button class="primary" onclick="status(\''+o.id+'\',\'authorized\')">Authorize & Send Kitchen</button>';if(me.role==='admin'&&o.status==='authorized')buttons='<button class="dark" onclick="status(\''+o.id+'\',\'sent_to_kitchen\')">Send to Kitchen</button>';if(me.role==='kitchen'&&['sent_to_kitchen','authorized'].includes(o.status))buttons='<button class="dark" onclick="status(\''+o.id+'\',\'preparing\')">Start Making</button>';if(me.role==='kitchen'&&o.status==='preparing')buttons='<button class="primary" onclick="status(\''+o.id+'\',\'ready\')">Order Ready</button>';if(me.role==='cashier'&&o.status==='ready')buttons='<button class="primary" onclick="status(\''+o.id+'\',\'paid\')">Collect Cash / Mark Paid</button>';if(me.role==='cashier'&&o.status==='paid')buttons='<button class="dark" onclick="status(\''+o.id+'\',\'closed\')">Close Order</button>';return `<div class="order"><div style="display:flex;justify-content:space-between"><b>${o.number}</b><span class="badge">${o.status}</span></div><p>${o.items.map(i=>`${i.name} × ${i.qty}`).join(' • ')}</p><small class="muted">${o.orderType} ${o.table?'• '+o.table:''} • ${new Date(o.createdAt).toLocaleString()}</small><h3>${money(o.total)}</h3><div class="actions">${buttons}</div></div>`}
async function status(id,s){try{await api('/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})});orders()}catch(e){alert(e.message)}}
async function productsPage(){const ps=await api('/products');view.innerHTML=`<h1>Products</h1><div class="panel"><p class="muted">Product management is admin-only.</p>${ps.map(p=>`<div class="order"><b>${p.name}</b> • ${p.category} • ${money(p.price)} • Stock ${p.stock}</div>`).join('')}</div>`}
async function settings(){const c=await api('/settings');view.innerHTML=`<h1>Company Settings</h1><div class="panel"><input id="cn" value="${c.name}"><input id="ca" value="${c.address}"><input id="cp" value="${c.phone}"><input id="ct" type="number" value="${c.tax}"><button class="primary" onclick="saveSettings()">Save</button></div>`}async function saveSettings(){await api('/settings',{method:'PUT',body:JSON.stringify({name:cn.value,address:ca.value,phone:cp.value,tax:Number(ct.value)})});alert('Saved')}function logout(){localStorage.clear();token='';me=null;login()}render();
</script></body></html>
