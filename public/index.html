<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK Pizza & Ice Bar POS</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f5f7fa;color:#172033}*{box-sizing:border-box}.login{min-height:100vh;display:grid;place-items:center}.card,.panel{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;box-shadow:0 5px 18px #00000008}.login .card{width:min(390px,92vw)}input,select,textarea{width:100%;padding:11px;margin:5px 0;border:1px solid #d1d5db;border-radius:8px}button{border:0;border-radius:8px;padding:10px 13px;cursor:pointer;font-weight:650}.primary{background:#e11d48;color:#fff}.dark{background:#172033;color:#fff}.danger{background:#fee2e2;color:#991b1b}.muted{color:#64748b}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:20px}.side h2{margin:0}.side small{color:#94a3b8}.side button{display:block;width:100%;margin-top:6px;background:transparent;color:#cbd5e1;text-align:left}.side button:hover,.side button.active{background:#263247;color:#fff}.main{padding:22px;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.stat strong{display:block;font-size:22px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 390px;gap:16px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.product{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:13px;cursor:pointer}.product:hover{border-color:#e11d48}.price{font-weight:800;font-size:18px;margin-top:8px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.actions{display:flex;gap:7px;flex-wrap:wrap}.order{background:#fff;border:1px solid #e5e7eb;border-radius:11px;padding:14px;margin-bottom:9px}.badge{padding:4px 8px;border-radius:20px;background:#eef2ff;font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left}.section{margin-top:15px}.kpi{font-size:28px;font-weight:800}.tabs button{margin-right:6px}.error{color:#b91c1c}@media(max-width:1050px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:5}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}} </style></head><body><div id="root"></div><script>
const A='/api';let token=localStorage.mkToken||'',me=JSON.parse(localStorage.mkUser||'null'),ps=[],cart=[];const root=document.getElementById('root');const money=n=>'Rs '+Number(n||0).toLocaleString('en-PK');async function api(p,o={}){const r=await fetch(A+p,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
function login(){root.innerHTML=`<div class=login><div class=card><h1>MK Pizza & Ice Bar</h1><p class=muted>Complete POS & Restaurant Control Center</p><input id=u value=admin placeholder=Username><input id=p type=password value=admin123 placeholder=Password><button class=primary style="width:100%" onclick=signin()>Sign in</button><p class=muted>Demo: admin/admin123 • waiter/waiter123 • kitchen/kitchen123 • cashier/cashier123</p><div id=e class=error></div></div></div>`}async function signin(){try{let d=await api('/login',{method:'POST',body:JSON.stringify({username:u.value,password:p.value})});token=d.token;me=d.user;localStorage.mkToken=token;localStorage.mkUser=JSON.stringify(me);shell()}catch(x){e.textContent=x.message}}
function shell(){if(!token||!me)return login();const admin=me.role==='admin';root.innerHTML=`<div class=app><aside class=side><h2>MK Pizza</h2><small>Ice Bar • Bhakkar</small><hr><button onclick=home()>⌂ Dashboard</button><button onclick=orders()>▣ Orders / KDS</button>${['waiter','admin'].includes(me.role)?'<button onclick=pos()>＋ New Sale</button>':''}${admin?'<button onclick=menu()>🍕 Menu / Products</button><button onclick=module(\'riders\')>🏍 Riders</button><button onclick=module(\'users\')>👥 Staff</button><button onclick=module(\'expenses\')>💸 Expenses</button><button onclick=module(\'accounts\')>💰 Accounts</button><button onclick=module(\'customers\')>👤 Customers</button><button onclick=module(\'suppliers\')>🚚 Suppliers</button><button onclick=demands()>📋 Demands</button><button onclick=inventory()>📦 Inventory / Production</button><button onclick=analytics()>📊 Analytics</button><button onclick=settings()>⚙ Settings</button>':''}<button onclick=logout()>↪ Logout</button></aside><main class=main id=view></main></div>`;home()}
async function home(){let d={salesToday:0,ordersToday:0,pending:0,kitchen:0,ready:0,products:0,lowStock:0};if(['admin','cashier'].includes(me.role))d=await api('/dashboard');view.innerHTML=`<div class=top><div><h1>${me.role[0].toUpperCase()+me.role.slice(1)} Dashboard</h1><span class=muted>MK Pizza & Ice Bar • ${me.name}</span></div></div>${['admin','cashier'].includes(me.role)?`<div class=stats><div class=stat>Sales Today<strong>${money(d.salesToday)}</strong></div><div class=stat>Orders<strong>${d.ordersToday}</strong></div><div class=stat>Pending<strong>${d.pending}</strong></div><div class=stat>Kitchen<strong>${d.kitchen}</strong></div><div class=stat>Ready<strong>${d.ready}</strong></div></div>`:''}<div class=panel style="margin-top:16px"><h2>Controlled Workflow</h2><p>Online Customer / Waiter → <b>Admin Authorization</b> → Kitchen → Preparing → Ready → Cashier Payment → Closed.</p><div class=actions><button class=primary onclick=orders()>Open Live Orders</button>${me.role==='admin'?'<button onclick=analytics()>Open Item Analytics</button><button onclick=inventory()>Stock & Yield</button>':''}</div></div>`}
async function pos(){ps=await api('/products');cart=[];view.innerHTML=`<div class=top><h1>New Sale</h1><button onclick=orders()>Orders</button></div><div class=grid><div class=panel><input id=q placeholder="Search / SKU / category" oninput=renderPS()><div id=plist class=products></div></div><div class=panel><h3>Cart</h3><input id=cust placeholder="Customer / Table"><select id=otype><option>dine-in</option><option>takeaway</option><option>delivery</option></select><div id=cart></div><h2 id=total>Total: Rs 0</h2><select id=pay><option>cash</option><option>card</option><option>mobile</option></select><button class=primary style="width:100%" onclick=place()>Send for Admin Authorization</button></div></div>`;renderPS();renderCart()}function renderPS(){const x=(q?.value||'').toLowerCase();plist.innerHTML=ps.filter(p=>JSON.stringify(p).toLowerCase().includes(x)).map(p=>`<div class=product onclick="add('${p.id}')"><b>${p.name}</b><div class=muted>${p.category} • stock ${p.stock}</div>${(p.variants||[]).map(v=>`<button onclick="event.stopPropagation();addv('${p.id}','${v.name}',${v.price})" style="margin:3px 2px">${v.name} ${money(v.price)}</button>`).join('')}<div class=price>${money(p.price)}</div></div>`).join('')}function add(id){addv(id,null,null)}function addv(id,v,price){const p=ps.find(x=>x.id===id),x=cart.find(i=>i.productId===id&&i.variant===v);if(x)x.qty++;else cart.push({productId:id,variant:v,price:price||p.price,qty:1});renderCart()}function renderCart(){cartEl.innerHTML=cart.map((i,n)=>`<div class=row style="padding:7px 0;border-bottom:1px solid #eee"><span>${ps.find(p=>p.id===i.productId).name} ${i.variant||''}</span><span><button onclick=chg(${n},-1)>−</button> ${i.qty} <button onclick=chg(${n},1)>+</button></span><b>${money(i.price*i.qty)}</b></div>`).join('')||'<p class=muted>Empty</p>';total.textContent='Total: '+money(cart.reduce((s,i)=>s+i.price*i.qty,0))}function chg(n,x){cart[n].qty+=x;if(cart[n].qty<1)cart.splice(n,1);renderCart()}async function place(){if(!cart.length)return alert('Add items');try{let o=await api('/orders',{method:'POST',body:JSON.stringify({items:cart,paymentMethod:pay.value,table:cust.value,orderType:otype.value})});alert(o.number+' sent for authorization');orders()}catch(e){alert(e.message)}}
async function orders(){let os=await api('/orders');view.innerHTML=`<div class=top><h1>Order Control / Kitchen Display</h1><button onclick="orders()">Refresh</button></div>${os.map(o=>{let b='';if(me.role==='admin'&&['pending','awaiting_authorization'].includes(o.status))b=`<button class=primary onclick="st('${o.id}','authorized')">Authorize</button>`;else if(me.role==='admin'&&o.status==='authorized')b=`<button onclick="st('${o.id}','sent_to_kitchen')">Send Kitchen</button>`;else if(me.role==='kitchen'&&['sent_to_kitchen','authorized'].includes(o.status))b=`<button onclick="st('${o.id}','preparing')">Start Making</button>`;else if(me.role==='kitchen'&&o.status==='preparing')b=`<button class=primary onclick="st('${o.id}','ready')">Ready</button>`;else if(me.role==='cashier'&&o.status==='ready')b=`<button class=primary onclick="st('${o.id}','paid')">Collect Cash / Paid</button>`;else if(me.role==='cashier'&&o.status==='paid')b=`<button onclick="st('${o.id}','closed')">Close</button>`;return `<div class=order><div class=row><b>${o.number}</b><span class=badge>${o.status}</span></div><p>${o.items.map(i=>i.name+(i.variant?' • '+i.variant:'')+' × '+i.qty).join(' | ')}</p><div class=muted>${o.orderType} ${o.table?'• '+o.table:''} • ${new Date(o.createdAt).toLocaleString()}</div><h3>${money(o.total)}</h3><div class=actions>${b}<button onclick='alert(${JSON.stringify(JSON.stringify(o.history))})'>History</button></div></div>`}).join('')||'<div class=panel>No orders</div>'}`};async function st(id,s){try{await api('/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})});orders()}catch(e){alert(e.message)}}
async function menu(){ps=await api('/products');view.innerHTML=`<div class=top><h1>Menu / Products</h1><div class=actions><button onclick=addProduct()>＋ Add</button><button onclick=downloadCSV()>⬇ Download CSV</button><label><button onclick=uploadCSV()>⬆ Bulk Upload</button></label><button class=danger onclick=bulkDelete()>Delete All</button></div></div><div class=panel><p class=muted>Select-all, bulk edit/delete, variants and combo/deal-ready product records.</p><table class=table><thead><tr><th><input type=checkbox onchange="document.querySelectorAll('.pick').forEach(x=>x.checked=this.checked)"></th><th>Name</th><th>SKU</th><th>Variants</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead><tbody>${ps.map(p=>`<tr><td><input class=pick value=${p.id} type=checkbox></td><td>${p.name}</td><td>${p.sku}</td><td>${(p.variants||[]).map(v=>v.name).join(', ')||'Standard'}</td><td>${money(p.price)}</td><td>${p.stock}</td><td><button onclick="editProduct('${p.id}')">Edit</button> <button class=danger onclick="delProduct('${p.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div>`}function addProduct(){let n=prompt('Product name');if(!n)return;let s=prompt('SKU');let pr=Number(prompt('Price','0'));api('/products',{method:'POST',body:JSON.stringify({name:n,sku:s,price:pr})}).then(menu)}function editProduct(id){let p=ps.find(x=>x.id===id),pr=Number(prompt('New price',p.price));api('/products/'+id,{method:'PUT',body:JSON.stringify({price:pr})}).then(menu)}function delProduct(id){if(confirm('Delete product?'))api('/products/'+id,{method:'DELETE'}).then(menu)}function bulkDelete(){if(confirm('Delete ALL menu items?'))document.querySelectorAll('.pick:checked').forEach(x=>api('/products/'+x.value,{method:'DELETE'}).then(menu))}function downloadCSV(){fetch(A+'/products/export',{headers:{Authorization:'Bearer '+token}}).then(r=>r.blob()).then(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mk-pizza-products.csv';a.click()})}function uploadCSV(){let i=document.createElement('input');i.type='file';i.accept='.csv';i.onchange=()=>{let r=new FileReader();r.onload=()=>{let lines=r.result.trim().split(/\r?\n/).slice(1),rows=lines.map(x=>{let a=x.split(',').map(z=>z.replace(/^"|"$/g,''));return{name:a[0],sku:a[1],price:a[2],stock:a[3],unit:a[4],category:a[5]}});api('/products/bulk',{method:'POST',body:JSON.stringify({rows})}).then(menu)};r.readAsText(i.files[0])};i.click()}
async function module(name){let rows=await api('/'+name),title=name[0].toUpperCase()+name.slice(1);view.innerHTML=`<div class=top><h1>${title}</h1><button class=primary onclick="addRow('${name}')">＋ Add</button></div><div class=panel><table class=table><thead><tr>${Object.keys(rows[0]||{name:'Name'}).slice(0,7).map(k=>'<th>'+k+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+Object.keys(r).slice(0,7).map(k=>'<td>'+String(r[k]).slice(0,60)+'</td>').join('')+'</tr>').join('')||'<tr><td>No records</td></tr>'}</tbody></table></div>`}function addRow(n){let label=prompt('Name / description');if(!label)return;let body=n==='users'?{name:label,username:prompt('Username'),password:prompt('Password')||'change-me',role:prompt('Role','waiter')}:n==='expenses'?{title:label,amount:Number(prompt('Amount','0'))}:n==='riders'?{name:label,phone:prompt('Phone','')}:n==='customers'?{name:label,phone:prompt('Phone','')}:n==='suppliers'?{name:label,phone:prompt('Phone','')}:n==='accounts'?{name:label,balance:Number(prompt('Opening balance','0'))}:{name:label};api('/'+n,{method:'POST',body:JSON.stringify(body)}).then(()=>module(n))}
async function demands(){let d=await api('/demands');view.innerHTML=`<h1>Demands / Purchasing Requests</h1><div class=panel><button class=primary onclick=addDemand()>＋ New Demand</button><table class=table><thead><tr><th>Item</th><th>Qty</th><th>Unit</th><th>Type</th><th>Status</th></tr></thead><tbody>${d.map(x=>`<tr><td>${x.item}</td><td>${x.qty}</td><td>${x.unit}</td><td>${x.type}</td><td>${x.status}</td></tr>`).join('')}</tbody></table></div>`}function addDemand(){let item=prompt('Item');if(!item)return;let qty=Number(prompt('Quantity','1'));api('/demands',{method:'POST',body:JSON.stringify({item,qty,unit:prompt('Unit','kg'),type:'purchase'})}).then(demands)}
async function inventory(){let y=await api('/analytics/yield');view.innerHTML=`<h1>Inventory & Production Yield</h1><div class=panel><h3>Meat / Raw Material Conversion</h3><p>Record raw input and usable output. Example: 100 kg purchased → 70 kg usable meat = 30 kg processing loss (30%).</p><div class=row><input id=mat placeholder=Material value=Meat><input id=iq type=number placeholder="Input kg"><input id=oq type=number placeholder="Output kg"><button class=primary onclick=yieldSave()>Record Yield</button></div></div><div class=panel><table class=table><tr><th>Material</th><th>Input</th><th>Output</th><th>Loss</th><th>Loss %</th></tr>${y.map(x=>`<tr><td>${x.material}</td><td>${x.inputQty} ${x.inputUnit}</td><td>${x.outputQty} ${x.outputUnit}</td><td>${x.lossQty}</td><td>${x.lossPercent}%</td></tr>`).join('')}</table></div>`}async function yieldSave(){await api('/production/yield',{method:'POST',body:JSON.stringify({material:mat.value,inputQty:iq.value,outputQty:oq.value})});inventory()}
async function analytics(){let a=await api('/analytics/items'),s=await api('/analytics/sales');view.innerHTML=`<h1>Sales & Demand Analysis</h1><div class=stats><div class=stat>Revenue<strong>${money(s.revenue)}</strong></div><div class=stat>Paid Orders<strong>${s.orders}</strong></div><div class=stat>Tracked SKUs<strong>${a.length}</strong></div></div><div class=panel style="margin-top:15px"><h2>Every Variant Tracked Separately</h2><p class=muted>Pizza Small/Medium/Large/XL, Shawarma Small/Medium/Large, Burger Special/Chicken/Zinger, Biryani Half/Full, Ice Cream 1/2 Scoops and every standard item are separate ledger rows. Combo/deal components can be stored on each line for item-level analysis.</p><table class=table><tr><th>Item</th><th>Variant</th><th>Qty Sold</th><th>Sales</th></tr>${a.map(x=>`<tr><td>${x.item}</td><td>${x.variant}</td><td>${x.qty}</td><td>${money(x.amount)}</td></tr>`).join('')}</table></div>`}
async function settings(){let c=await api('/settings');view.innerHTML=`<h1>Company Settings</h1><div class=panel><input id=cn value="${c.name}"><input id=ca value="${c.address}"><input id=cp value="${c.phone}"><input id=ct type=number value="${c.tax}"><button class=primary onclick="saveSet()">Save</button></div>`}async function saveSet(){await api('/settings',{method:'PUT',body:JSON.stringify({name:cn.value,address:ca.value,phone:cp.value,tax:Number(ct.value)})});alert('Saved')}function logout(){localStorage.clear();token='';me=null;login()}shell();</script></body></html>
