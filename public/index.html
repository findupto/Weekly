<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>MK Pizza & Ice Bar POS</title><style>html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f6f8;color:#172033}.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.box{width:360px;max-width:90%;background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 35px rgba(0,0,0,.12)}h1{margin-top:0}input,button{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd2da;border-radius:8px;box-sizing:border-box;font-size:16px}button{cursor:pointer;font-weight:700}.primary{background:#d7194b;color:#fff;border-color:#d7194b}.muted{color:#667085}.error{color:#b42318}.app{min-height:100vh;display:flex}.side{width:230px;background:#101827;color:#fff;padding:18px;box-sizing:border-box}.side button{background:transparent;color:#fff;border:0;text-align:left}.main{flex:1;padding:25px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px}@media(max-width:800px){.app{display:block}.side{width:100%}.cards{grid-template-columns:1fr 1fr}}</style></head><body><div class="login" id="login"><div class="box"><h1>MK Pizza & Ice Bar</h1><p class="muted">Restaurant POS · Abbas Chowk Collage Road Bhakkar</p><p class="muted">0316 9700025 · Currency Rs · Tax 0</p><form id="loginForm"><input id="username" autocomplete="username" placeholder="Username" value="admin"><input id="password" type="password" autocomplete="current-password" placeholder="Password" value="admin123"><button class="primary" type="submit">Sign In</button></form><p class="muted">Demo: admin / admin123</p><p id="error" class="error"></p></div></div><div id="app" style="display:none"></div><script>var API='/api',token=localStorage.getItem('mkToken')||'';function q(id){return document.getElementById(id)}function esc(x){return String(x==null?'':x).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function money(x){return 'Rs '+Number(x||0).toLocaleString('en-PK')}function request(path,options){options=options||{};options.headers=options.headers||{};options.headers['Content-Type']='application/json';if(token)options.headers.Authorization='Bearer '+token;return fetch(API+path,options).then(function(r){return r.text().then(function(t){var d;try{d=t?JSON.parse(t):{}}catch(e){throw Error('Invalid server response')};if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d})})}function showApp(user){q('login').style.display='none';q('app').style.display='flex';q('app').innerHTML='<aside class="side"><h2>MK Pizza POS</h2><p>Signed in: '+esc(user.name||user.username)+'</p><p>Role: '+esc(user.role)+'</p><button onclick="dashboard()">Dashboard</button><button onclick="orders()">Orders</button><button onclick="products()">Menu</button><button onclick="sales()">Sales</button><button onclick="inventory()">Inventory</button><button onclick="analytics()">Analytics</button><button onclick="logout()">Logout</button></aside><main class="main" id="view"><div class="card"><h1>Dashboard</h1><p>Loading dashboard...</p></div></main>';dashboard()}function login(){q('loginForm').onsubmit=function(e){e.preventDefault();q('error').textContent='Signing in...';request('/login',{method:'POST',body:JSON.stringify({username:q('username').value,password:q('password').value})}).then(function(d){token=d.token;localStorage.setItem('mkToken',token);localStorage.setItem('mkUser',JSON.stringify(d.user));showApp(d.user)}).catch(function(e){q('error').textContent=e.message})}}function logout(){localStorage.removeItem('mkToken');localStorage.removeItem('mkUser');location.reload()}function dashboard(){q('view').innerHTML='<div class="card"><h1>Control Center</h1><p>Loading dashboard...</p></div>';request('/dashboard').then(function(d){q('view').innerHTML='<h1>Control Center</h1><div class="cards"><div class="card">Sales Today<h2>'+money(d.salesToday)+'</h2></div><div class="card">Orders<h2>'+esc(d.ordersToday)+'</h2></div><div class="card">Pending<h2>'+esc(d.pending)+'</h2></div><div class="card">Low Stock<h2>'+esc(d.lowStock)+'</h2></div></div>'}).catch(function(e){q('view').innerHTML='<div class="card"><h2>Dashboard error</h2><p class="error">'+esc(e.message)+'</p></div>'})}function orders(){request('/orders').then(function(d){q('view').innerHTML='<h1>Orders</h1><div class="card"><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}).catch(function(e){q('view').innerHTML='<div class="card error">'+esc(e.message)+'</div>'})}function products(){request('/products').then(function(d){q('view').innerHTML='<h1>Menu</h1><div class="cards">'+(d||[]).map(function(p){return '<div class="card"><b>'+esc(p.name)+'</b><p>'+esc(p.category)+'</p><h3>'+money(p.price)+'</h3></div>'}).join('')+'</div>'}).catch(function(e){q('view').innerHTML='<div class="card error">'+esc(e.message)+'</div>'})}function sales(){request('/sales').then(function(d){q('view').innerHTML='<h1>Sales History</h1><div class="card"><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}).catch(function(e){q('view').innerHTML='<div class="card error">'+esc(e.message)+'</div>'})}function inventory(){request('/inventory').then(function(d){q('view').innerHTML='<h1>Inventory</h1><div class="card"><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}).catch(function(e){q('view').innerHTML='<div class="card error">'+esc(e.message)+'</div>'})}function analytics(){request('/analytics').then(function(d){q('view').innerHTML='<h1>Analytics</h1><div class="card"><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}).catch(function(e){q('view').innerHTML='<div class="card error">'+esc(e.message)+'</div>'})}login();try{var u=JSON.parse(localStorage.getItem('mkUser')||'null');if(token&&u)showApp(u)}catch(e){localStorage.clear()}</script></body></html>
