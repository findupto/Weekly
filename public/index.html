<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MK Pizza & Ice Bar POS</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#172033}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,92vw);background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 40px #0002}input,button{font:inherit;padding:11px;border:1px solid #d5dbe5;border-radius:8px}input{width:100%;margin:7px 0}button{cursor:pointer;font-weight:700;background:#fff}.primary{background:#d7194b;color:#fff;border-color:#d7194b}.error{color:#b00020;white-space:pre-wrap}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#101827;color:#fff;padding:16px}.side button{display:block;width:100%;margin:5px 0;text-align:left;background:transparent;color:#fff;border:0}.main{padding:24px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px}.card strong{display:block;font-size:25px;margin-top:7px}@media(max-width:800px){.app{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.side{position:static}}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
'use strict';
var root=document.getElementById('root');
if(!root){document.body.innerHTML='<h1 style="padding:30px">POS frontend error: root element missing</h1>';return;}
var token=localStorage.getItem('mkToken')||'';
var user=null;
try{user=JSON.parse(localStorage.getItem('mkUser')||'null')}catch(e){localStorage.removeItem('mkUser');}
var API=(localStorage.getItem('mkApi')||'/api').replace(/\/$/,'');
function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c})}
function money(v){return 'Rs '+Number(v||0).toLocaleString('en-PK')}
async function api(path,opt){opt=opt||{};var headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;var r=await fetch(API+path,Object.assign({},opt,{headers:Object.assign(headers,opt.headers||{})}));var text=await r.text();var d={};try{d=text?JSON.parse(text):{}}catch(e){throw Error('Server returned invalid JSON (HTTP '+r.status+')')}if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
function login(){root.innerHTML='<div class="login"><div class="box"><h1>MK Pizza & Ice Bar</h1><p>Restaurant Operating System</p><input id="u" placeholder="Username" value="admin"><input id="p" type="password" placeholder="Password" value="admin123"><button class="primary" style="width:100%" id="signin">Sign In</button><p>Demo: admin/admin123</p><div id="err" class="error"></div></div></div>';document.getElementById('signin').onclick=signin;}
async function signin(){var e=document.getElementById('err');e.textContent='Signing in...';try{var d=await api('/login',{method:'POST',body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})});token=d.token;user=d.user;localStorage.setItem('mkToken',token);localStorage.setItem('mkUser',JSON.stringify(user));shell()}catch(x){e.textContent=x.message}}
function logout(){localStorage.removeItem('mkToken');localStorage.removeItem('mkUser');token='';user=null;login()}
function shell(){if(!token||!user)return login();root.innerHTML='<div class="app"><aside class="side"><h2>MK Pizza</h2><small>Bhakkar · Rs · Tax 0</small><hr><button data-page="home">Dashboard</button><button data-page="orders">Live Orders</button><button data-page="products">Menu</button><button data-page="sales">Sales</button><button data-page="inventory">Inventory</button><button data-page="analytics">Analytics</button><button id="logout">Logout</button></aside><main class="main" id="view"></main></div>';document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){page(b.dataset.page)}});document.getElementById('logout').onclick=logout;page('home')}
async function page(p){var v=document.getElementById('view');v.innerHTML='<div class="card"><h2>Loading...</h2></div>';try{if(p==='home')await home();else if(p==='orders')await orders();else if(p==='products')await products();else if(p==='sales')await sales();else if(p==='inventory')await inventory();else await analytics()}catch(e){v.innerHTML='<div class="card"><h2>Unable to load</h2><p class="error">'+esc(e.message)+'</p><button id="retry">Retry</button></div>';document.getElementById('retry').onclick=function(){page(p)}}}
async function home(){var d=await api('/dashboard');view.innerHTML='<h1>Control Center</h1><p>Welcome '+esc(user.name||user.username)+' · '+esc(user.role)+'</p><div class="cards"><div class="card">Sales Today<strong>'+money(d.salesToday)+'</strong></div><div class="card">Orders<strong>'+esc(d.ordersToday)+'</strong></div><div class="card">Pending<strong>'+esc(d.pending)+'</strong></div><div class="card">Low Stock<strong>'+esc(d.lowStock)+'</strong></div></div><div class="card" style="margin-top:15px"><h2>Automation</h2><p>Order → Authorization → Kitchen → Ready → Payment → Closed → Inventory → Accounts → Analytics</p></div>'}
async function orders(){var os=await api('/orders');view.innerHTML='<h1>Live Orders</h1>'+((os||[]).map(function(o){return '<div class="card" style="margin:10px 0"><b>'+esc(o.number)+'</b> · '+esc(o.status)+'<p>'+esc((o.items||[]).map(function(i){return (i.name||i.productId)+' '+(i.variant||'')+' × '+i.qty}).join(' · '))+'</p><b>'+money(o.total)+'</b></div>'}).join('')||'<div class="card">No orders.</div>')}
async function products(){var ps=await api('/products');view.innerHTML='<h1>Menu</h1><div class="cards">'+((ps||[]).map(function(p){return '<div class="card"><b>'+esc(p.name)+'</b><p>'+esc(p.category||'')+'</p><strong>'+money(p.price)+'</strong><small>Stock: '+esc(p.stock)+'</small></div>'}).join('')||'<div class="card">No products.</div>')+'</div>'}
async function sales(){var d=await api('/sales');view.innerHTML='<h1>Sales History</h1><div class="card"><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}
async function inventory(){var d=await api('/inventory');view.innerHTML='<h1>Inventory</h1><div class="card"><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}
async function analytics(){var d=await api('/analytics');view.innerHTML='<h1>Analytics</h1><div class="card"><pre>'+esc(JSON.stringify(d,null,2))+'</pre></div>'}
window.addEventListener('error',function(e){if(root&&!root.innerText.trim())root.innerHTML='<div class="box"><h2>Frontend error</h2><p class="error">'+esc(e.message)+'</p></div>'});
if(token&&user)shell();else login();
})();
</script>
</body>
</html>
