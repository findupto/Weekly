<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK Pizza & Ice Bar POS</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;background:#f4f6f8;color:#172033}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #d5dbe5;border-radius:8px}button{cursor:pointer;font-weight:700;background:#fff}button.primary{background:#d7194b;color:#fff;border-color:#d7194b}.danger{color:#a00;background:#fff1f1}.muted{color:#68758a}.login{min-height:100vh;display:grid;place-items:center}.login .box{width:min(430px,92vw);background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 40px #0001}.login input{width:100%;margin:6px 0}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#101827;color:#fff;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#dbe3ef;margin:3px 0}.side button.active,.side button:hover{background:#26344b}.main{padding:22px;max-width:1600px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid #e1e5eb;border-radius:12px;padding:15px}.card strong{display:block;font-size:22px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 390px;gap:14px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.product{border:1px solid #e1e5eb;border-radius:10px;padding:12px;background:#fff}.product button{margin:3px}.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.order{background:#fff;border:1px solid #e1e5eb;border-radius:12px;padding:14px;margin:9px 0}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eef2ff;font-size:12px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.form>*{width:100%}.error{color:#b00020;margin-top:8px;white-space:pre-wrap}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{height:auto;position:sticky;z-index:5}.form{grid-template-columns:1fr}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.main{padding:12px}}</style></head><body><div id="root"></div><script>
'use strict';
const root=document.getElementById('root');let token=localStorage.mkToken||'',me=JSON.parse(localStorage.mkUser||'null'),products=[],cart=[];const API=(localStorage.mkApi||'/api').replace(/\/$/,'');const money=n=>'Rs '+Number(n||0).toLocaleString('en-PK');
async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opt.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function login(){root.innerHTML='<div class="login"><div class="box"><h1>MK Pizza & Ice Bar</h1><p class="muted">Restaurant Operating System</p><input id="server" placeholder="Optional API URL for mobile" value="'+esc(localStorage.mkApi||'')+'"><input id="username" placeholder="Username" value="admin"><input id="password" type="password" placeholder="Password" value="admin123"><button class="primary" style="width:100%;margin-top:6px" onclick="signin()">Sign In</button><p class="muted">Demo: admin/admin123 · waiter/waiter123 · kitchen/kitchen123 · cashier/cashier123</p><div id="loginError" class="error"></div></div></div>}
function esc(x){return String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function signin(){try{if(server.value.trim()){localStorage.mkApi=server.value.trim().replace(/\/$/,'');location.reload();return}const d=await api('/login',{method:'POST',body:JSON.stringify({username:username.value,password:password.value})});token=d.token;me=d.user;localStorage.mkToken=token;localStorage.mkUser=JSON.stringify(me);shell()}catch(e){loginError.textContent=e.message}}
function logout(){localStorage.removeItem('mkToken');localStorage.removeItem('mkUser');location.reload()}
function shell(){if(!token||!me)return login();const admin=me.role==='admin';let nav=[['home','Dashboard'],['orders','Live Orders']];if(['admin','waiter'].includes(me.role))nav.push(['pos','New Sale']);if(admin)nav.push(...[['menu','Menu'],['combos','Combos'],['recipes','Recipes'],['inventory','Inventory'],['production','Production'],['demands','Demands'],['purchases','Purchasing'],['riders','Riders'],['staff','Staff'],['customers','Customers'],['suppliers','Suppliers'],['expenses','Expenses'],['accounts','Accounts'],['analytics','Analytics'],['audit','Audit Log'],['settings','Settings']]);root.innerHTML='<div class="app"><aside class="side"><h2>MK Pizza</h2><small>Ice Bar · Bhakkar</small><hr>'+nav.map(n=>'<button id="n-'+n[0]+'" onclick="go(\''+n[0]+'\')">'+n[1]+'</button>').join('')+'<hr><button onclick="logout()">Logout</button></aside><main class="main"><div id="view"></div></main></div>';go('home')}
function nav(k){document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));const x=document.getElementById('n-'+k);if(x)x.classList.add('active')}
async function go(k){nav(k);try{await ({home,orders,pos,menu,combos,recipes,inventory,production,demands,purchases,riders,staff,customers,suppliers,expenses,accounts,analytics,audit,settings}[k]||home)()}catch(e){view.innerHTML='<div class="panel"><h2>Unable to load</h2><p class="error">'+esc(e.message)+'</p><button onclick="go(\''+k+'\')">Retry</button></div>'}}
async function home(){const d=await api('/dashboard');view.innerHTML='<div class="top"><div><h1>Control Center</h1><span class="muted">'+esc(me.name)+' · '+esc(me.role)+'</span></div></div><div class="cards">'+[['Sales Today',money(d.salesToday)],['Orders',d.ordersToday],['Pending',d.pending],['Kitchen',d.kitchen],['Ready',d.ready],['Low Stock',d.lowStock]].map(x=>'<div class="card">'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div><div class="panel" style="margin-top:14px"><h2>Order automation</h2><p>Customer / Waiter → Admin authorization → Kitchen → Preparing → Ready → Cashier → Paid → Closed → sales + inventory + analytics.</p><div class="actions"><button class="primary" onclick="go(\'orders\')">Live Orders</button><button onclick="go(\'pos\')">New Sale</button><button onclick="go(\'analytics\')">Analytics</button></div></div>'}
async function pos(){products=await api('/products');cart=[];view.innerHTML='<div class="top"><h1>New Sale</h1><button onclick="go(\'orders\')">Live Orders</button></div><div class="grid"><div class="panel"><input id="search" placeholder="Search item / SKU / category" style="width:100%;margin-bottom:10px" oninput="drawProducts()"><div id="plist" class="products"></div></div><div class="panel"><h3>Cart</h3><select id="otype" style="width:100%"><option value="dine-in">Dine-in</option><option value="takeaway">Takeaway</option><option value="delivery">Delivery</option></select><input id="customerInfo" placeholder="Table / customer / address" style="width:100%;margin:7px 0"><div id="cartEl"></div><h2 id="grand">Rs 0</h2><select id="payment" style="width:100%"><option value="cash">Cash</option><option value="card">Card</option><option value="mobile">Mobile</option></select><button class="primary" style="width:100%;margin-top:8px" onclick="submitOrder()">Send for Admin Authorization</button></div></div>';drawProducts();drawCart()}
function drawProducts(){const q=(search.value||'').toLowerCase();plist.innerHTML=products.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(p=>'<div class="product"><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.category)+' · stock '+p.stock+'</div>'+((p.variants||[]).length?(p.variants.map(v=>'<button onclick="add(\''+p.id+'\',\''+esc(v.name).replace(/'/g,"\\'")+'\','+Number(v.price)+')">'+esc(v.name)+' '+money(v.price)+'</button>').join('')):'<button onclick="add(\''+p.id+'\',null,'+Number(p.price)+')">Add '+money(p.price)+'</button>')+'</div>').join('')||'<p class="muted">No products found.</p>'}
function add(id,v,p){const x=cart.find(i=>i.productId===id&&i.variant===v);if(x)x.qty++;else cart.push({productId:id,variant:v,price:Number(p),qty:1});drawCart()}
function drawCart(){cartEl.innerHTML=cart.map((x,i)=>'<div class="row"><span>'+esc(products.find(p=>p.id===x.productId)?.name||x.productId)+' '+esc(x.variant||'')+' × '+x.qty+'</span><span><button onclick="chg('+i+',-1)">−</button> <button onclick="chg('+i+',1)">+</button></span><b>'+money(x.price*x.qty)+'</b></div>').join('')||'<p class="muted">Cart empty</p>';grand.textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0))}
function chg(i,v){cart[i].qty+=v;if(cart[i].qty<1)cart.splice(i,1);drawCart()}
async function submitOrder(){if(!cart.length)return alert('Cart is empty');const o=await api('/orders',{method:'POST',body:JSON.stringify({items:cart,orderType:otype.value,table:customerInfo.value,paymentMethod:payment.value})});alert(o.number+' submitted');go('orders')}
async function orders(){const os=await api('/orders');view.innerHTML='<div class="top"><h1>Live Orders</h1><button onclick="orders()">Refresh</button></div>'+(os.map(o=>{let b='';if(me.role==='admin'&&['pending','awaiting_authorization'].includes(o.status))b='<button class="primary" onclick="changeStatus(\''+o.id+'\',\'authorized\')">Authorize</button>';else if(me.role==='admin'&&o.status==='authorized')b='<button onclick="changeStatus(\''+o.id+'\',\'sent_to_kitchen\')">Send Kitchen</button>';else if(me.role==='kitchen'&&['sent_to_kitchen','authorized'].includes(o.status))b='<button onclick="changeStatus(\''+o.id+'\',\'preparing\')">Start Making</button>';else if(me.role==='kitchen'&&o.status==='preparing')b='<button class="primary" onclick="changeStatus(\''+o.id+'\',\'ready\')">Ready</button>';else if(me.role==='cashier'&&o.status==='ready')b='<button class="primary" onclick="changeStatus(\''+o.id+'\',\'paid\')">Collect Cash / Payment</button>';else if(me.role==='cashier'&&o.status==='paid')b='<button onclick="changeStatus(\''+o.id+'\',\'closed\')">Close</button>';return '<div class="order"><div class="top"><b>'+esc(o.number)+'</b><span class="badge">'+esc(o.status)+'</span></div><div>'+o.items.map(i=>esc(i.name)+' '+esc(i.variant||'')+' × '+i.qty).join(' · ')+'</div><p class="muted">'+esc(o.orderType)+' · '+esc(o.table||'')+' · '+new Date(o.createdAt).toLocaleString()+'</p><h3>'+money(o.total)+'</h3>'+b+' <button onclick="showHistory('+JSON.stringify(JSON.stringify(o.history))+')">History</button></div>'}).join('')||'<div class="panel">No orders.</div>')}
function showHistory(x){alert(x)}async function changeStatus(id,s){try{await api('/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})});orders()}catch(e){alert(e.message)}}
const labels={menu:'products',combos:'combos',recipes:'recipes',inventory:'inventory',production:'production',demands:'demands',purchases:'purchases',riders:'riders',staff:'users',customers:'customers',suppliers:'suppliers',expenses:'expenses',accounts:'accounts'};
async function generic(k){const rows=await api('/'+labels[k]);view.innerHTML='<div class="top"><h1>'+k[0].toUpperCase()+k.slice(1)+'</h1><div class="actions"><button class="primary" onclick="addRecord(\''+k+'\')">＋ Add</button>'+(k==='menu'?'<button onclick="bulkImport()">⬆ Bulk Upload</button><button onclick="exportMenu()">⬇ Download</button><button class="danger" onclick="bulkDelete()">Delete Selected</button>':'')+'</div></div><div class="panel"><table class="table"><tr>'+(k==='menu'?'<th><input type="checkbox" onchange="document.querySelectorAll(\'.pick\').forEach(x=>x.checked=this.checked)"></th>':'')+'<th>Record</th><th>Details</th><th>Created</th><th>Action</th></tr>'+rows.map(r=>'<tr>'+(k==='menu'?'<td><input class="pick" type="checkbox" value="'+esc(r.id)+'"></td>':'')+'<td><b>'+esc(r.name||r.title||r.item||r.productId||r.id)+'</b></td><td>'+esc(JSON.stringify(r).slice(0,300))+'</td><td>'+esc(r.createdAt||r.date||'')+'</td><td><button class="danger" onclick="removeRecord(\''+labels[k]+'\',\''+r.id+'\',\''+k+'\')">Delete</button></td></tr>').join('')+'</table></div>'}
for(const k of Object.keys(labels))window[k]=()=>generic(k);
async function addRecord(k){const name=prompt('Name / item / title');if(!name)return;const body={name,title:name,item:name};if(k==='staff')Object.assign(body,{username:prompt('Username')||name.toLowerCase().replace(/\s+/g,'.'),password:prompt('Password')||'change-me',role:prompt('Role','waiter')});if(k==='menu')Object.assign(body,{sku:prompt('SKU')||Date.now(),price:Number(prompt('Price','0')),category:prompt('Category','General'),unit:prompt('Unit','piece'),stock:Number(prompt('Opening stock','0')),variants:[]});if(k==='expenses')body.amount=Number(prompt('Amount','0'));if(['riders','customers','suppliers'].includes(k))body.phone=prompt('Phone','');if(k==='demands')Object.assign(body,{qty:Number(prompt('Quantity','0')),unit:prompt('Unit','kg/pcs')});await api('/'+labels[k],{method:'POST',body:JSON.stringify(body)});generic(k)}
async function removeRecord(route,id,k){if(confirm('Delete/deactivate this record?')){await api('/'+route+'/'+id,{method:'DELETE'});generic(k)}}
async function bulkDelete(){const ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)return alert('Select menu items');if(!confirm('Delete selected items?'))return;for(const id of ids)await api('/products/'+id,{method:'DELETE'});menu()}
function bulkImport(){const f=document.createElement('input');f.type='file';f.accept='.csv';f.onchange=()=>{const r=new FileReader();r.onload=async()=>{const lines=r.result.trim().split(/\r?\n/);if(lines.length<2)return;const rows=lines.slice(1).map(line=>{const a=line.split(',');return{name:a[0],sku:a[1],price:Number(a[2])||0,stock:Number(a[3])||0,unit:a[4]||'piece',category:a[5]||'General'}});await api('/products/bulk',{method:'POST',body:JSON.stringify({rows})});menu()};r.readAsText(f.files[0])};f.click()}
async function exportMenu(){const r=await fetch(API+'/products/export',{headers:{Authorization:'Bearer '+token}});const b=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mk-menu.csv';a.click();URL.revokeObjectURL(a.href)}
async function analytics(){const x=await api('/analytics/items');view.innerHTML='<div class="top"><h1>Item-Level Sales Analytics</h1><button onclick="analytics()">Refresh</button></div><div class="panel"><p class="muted">Each variant is tracked separately, including combo components.</p><table class="table"><tr><th>Item</th><th>Variant</th><th>Qty</th><th>Sales</th><th>Source</th></tr>'+x.sort((a,b)=>b.amount-a.amount).map(i=>'<tr><td>'+esc(i.item)+'</td><td>'+esc(i.variant)+'</td><td>'+i.qty+'</td><td>'+money(i.amount)+'</td><td>'+esc(i.source)+'</td></tr>').join('')+'</table></div>'}
async function audit(){const x=await api('/audit');view.innerHTML='<h1>Audit Log</h1><div class="panel"><table class="table"><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Detail</th></tr>'+x.map(a=>'<tr><td>'+esc(a.at)+'</td><td>'+esc(a.user)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.entity)+'</td><td>'+esc(a.detail)+'</td></tr>').join('')+'</table></div>'}
async function settings(){const c=await api('/settings');view.innerHTML='<h1>Company Settings</h1><div class="panel"><div class="form"><input id="cn" value="'+esc(c.name)+'"><input id="ca" value="'+esc(c.address)+'"><input id="cp" value="'+esc(c.phone)+'"><input id="ct" type="number" value="'+c.tax+'"><input id="cc" value="'+esc(c.currency)+'"><button class="primary" onclick="saveSettings()">Save</button></div></div>'}async function saveSettings(){await api('/settings',{method:'PUT',body:JSON.stringify({name:cn.value,address:ca.value,phone:cp.value,tax:Number(ct.value),currency:cc.value})});alert('Saved')}
async function production(){view.innerHTML='<div class="top"><h1>Production / Yield</h1></div><div class="panel"><p>Example: 100 kg raw meat → 70 kg usable meat → 30 kg processing loss.</p><div class="form"><input id="material" value="Meat"><input id="inputQty" type="number" placeholder="Raw input kg"><input id="outputQty" type="number" placeholder="Usable output kg"><button class="primary" onclick="saveYield()">Record Yield</button></div></div><div id="prodList" class="panel" style="margin-top:10px"></div>';const x=await api('/production');prodList.innerHTML=x.map(r=>'<div>'+esc(r.date)+' · '+esc(r.material)+' · '+r.inputQty+' → '+r.outputQty+' '+esc(r.outputUnit)+' · loss '+r.lossPercent+'%</div>').join('')||'<p class="muted">No production records.</p>'}async function saveYield(){await api('/production/yield',{method:'POST',body:JSON.stringify({material:material.value,inputQty:Number(inputQty.value),outputQty:Number(outputQty.value)})});production()}
if(token&&me)shell();else login();
</script></body></html>
