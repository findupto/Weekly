<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>MK Pizza & Ice Bar POS</title><style>body{margin:0;font:14px Arial;background:#f4f6f8;color:#172033}*{box-sizing:border-box}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #d6dbe3;border-radius:8px}button{cursor:pointer;font-weight:700;background:#fff}.primary{background:#d7194b;color:#fff;border-color:#d7194b}.danger{background:#fff0f0;color:#a00}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#101827;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.side h2{margin:0 0 3px}.side small{color:#9ca9bc}.side button{display:block;width:100%;text-align:left;background:transparent;color:#dbe3ef;border:0;margin:3px 0}.side button:hover,.side button.active{background:#26344b}.main{padding:22px;max-width:1600px;width:100%}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid #e1e5eb;border-radius:12px;padding:15px}.card strong{font-size:22px;display:block;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 400px;gap:14px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.product{border:1px solid #e1e5eb;border-radius:10px;padding:12px;background:#fff}.product:hover{border-color:#d7194b}.price{font-size:18px;font-weight:800;margin:8px 0}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.badge{padding:4px 8px;border-radius:20px;background:#eef2ff;font-size:12px}.muted{color:#68758a}.order{border:1px solid #e1e5eb;border-radius:10px;background:#fff;padding:13px;margin:9px 0}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.form>*{width:100%}.login{min-height:100vh;display:grid;place-items:center}.login .card{width:min(420px,92vw)}@media(max-width:1100px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.app{grid-template-columns:1fr}.side{height:auto;position:sticky;z-index:5}.form{grid-template-columns:1fr}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.main{padding:12px}}</style></head><body><div id=root></div><script>
const API=(localStorage.mkApi||'/api').replace(/\/$/,''),R=document.getElementById('root');let token=localStorage.mkToken||'',me=JSON.parse(localStorage.mkUser||'null'),products=[],cart=[];const money=n=>'Rs '+Number(n||0).toLocaleString('en-PK');async function api(p,o={}){let r=await fetch(API+p,{...o,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function login(){R.innerHTML='<div class=login><div class="card"><h1>MK Pizza & Ice Bar</h1><p class=muted>Restaurant Operating System</p><input id=server placeholder="HTTPS POS server URL (APK only)" value="'+(localStorage.mkApi||'')+'" style="width:100%;margin:5px 0"><input id=user placeholder=Username value=admin style="width:100%;margin:5px 0"><input id=pass type=password placeholder=Password value=admin123 style="width:100%;margin:5px 0"><button class=primary style="width:100%" onclick=signin()>Sign In</button><p class=muted>Demo: admin/admin123 · waiter/waiter123 · kitchen/kitchen123 · cashier/cashier123</p><div id=err></div></div></div>'}async function signin(){try{if(server.value.trim()){localStorage.mkApi=server.value.trim().replace(/\/$/,'');location.reload();return}let d=await api('/login',{method:'POST',body:JSON.stringify({username:user.value,password:pass.value})});token=d.token;me=d.user;localStorage.mkToken=token;localStorage.mkUser=JSON.stringify(me);shell()}catch(e){err.textContent=e.message}}function logout(){localStorage.removeItem('mkToken');localStorage.removeItem('mkUser');location.reload()}function shell(){if(!token||!me)return login();let a=me.role==='admin',items=[['home','Dashboard'],['orders','Live Orders'],...(me.role==='waiter'||a?[['pos','New Sale']]:[]),...(a?[['menu','Menu / Variants'],['combos','Combos / Deals'],['recipes','Recipes / BOM'],['inventory','Inventory'],['production','Production / Yield'],['demands','Demands'],['purchases','Purchasing'],['riders','Riders'],['staff','Staff'],['customers','Customers'],['suppliers','Suppliers'],['expenses','Expenses'],['accounts','Accounts'],['analytics','Analytics'],['audit','Audit Log'],['settings','Settings']]:[])];R.innerHTML='<div class=app><aside class=side><h2>MK Pizza</h2><small>Ice Bar · Bhakkar</small><hr>'+items.map(x=>'<button id=n-'+x[0] onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'<hr><button onclick=logout()>Logout</button></aside><main class=main id=view></main></div>';go('home')}function nav(x){document.querySelectorAll('.side button').forEach(b=>b.classList.remove('active'));let n=document.getElementById('n-'+x);if(n)n.classList.add('active')}
async function go(x){nav(x);try{await ({home,orders,pos,menu,combos,recipes,inventory,production,demands,purchases,riders,staff,customers,suppliers,expenses,accounts,analytics,audit,settings}[x]||home)()}catch(e){view.innerHTML='<div class=panel>'+e.message+'</div>'}}
async function home(){let d=await api('/dashboard');view.innerHTML='<div class=top><div><h1>Control Center</h1><span class=muted>'+me.name+' · '+me.role+'</span></div></div><div class=cards>'+[['Sales Today',money(d.salesToday)],['Orders',d.ordersToday],['Pending',d.pending],['Kitchen',d.kitchen],['Ready',d.ready],['Low Stock',d.lowStock]].map(x=>'<div class=card>'+x[0]+'<strong>'+x[1]+'</strong></div>').join('')+'</div><div class=panel style="margin-top:14px"><h2>Automated workflow</h2><p>Customer / Waiter → Admin authorization → Kitchen → Preparing → Ready → Cashier → Closed → inventory + sales ledger + accounts + analytics.</p><div class=actions><button class=primary onclick="go('orders')">Open live orders</button><button onclick="go('analytics')">Item analytics</button><button onclick="go('inventory')">Stock control</button></div></div>'}
async function pos(){products=await api('/products');cart=[];view.innerHTML='<div class=top><h1>New Sale</h1><button onclick=go("orders")>Orders</button></div><div class=grid><div class=panel><input id=search placeholder="Search item / SKU / category" oninput=drawProducts()><div id=plist class=products></div></div><div class=panel><h3>Cart</h3><select id=otype><option>dine-in</option><option>takeaway</option><option>delivery</option></select><input id=table placeholder="Table / customer / address" style="width:100%;margin:6px 0"><div id=cartEl></div><h2 id=grand>Rs 0</h2><select id=payment style="width:100%"><option>cash</option><option>card</option><option>mobile</option></select><button class=primary style="width:100%;margin-top:8px" onclick=submitOrder()>Send for Admin Authorization</button></div></div>';drawProducts();drawCart()}function drawProducts(){let q=(search.value||'').toLowerCase();plist.innerHTML=products.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(p=>'<div class=product><b>'+p.name+'</b><div class=muted>'+p.category+' · '+p.unit+' · stock '+p.stock+'</div>'+(p.variants||[]).map(v=>'<button style="margin:3px" onclick="add(\''+p.id+'\',\''+String(v.name).replaceAll("'","\\'")+'\','+v.price+')">'+v.name+' '+money(v.price)+'</button>').join('')+'<div class=price>'+money(p.price)+'</div><button onclick="add(\''+p.id+'\',null,'+p.price+')">Add standard</button></div>').join('')}function add(id,v,price){let x=cart.find(i=>i.productId===id&&i.variant===v);if(x)x.qty++;else cart.push({productId:id,variant:v,price,qty:1});drawCart()}function drawCart(){cartEl.innerHTML=cart.map((i,n)=>'<div class=row><span>'+products.find(p=>p.id===i.productId).name+' '+(i.variant||'')+'</span><span><button onclick="chg('+n+',-1)">−</button> '+i.qty+' <button onclick="chg('+n+',1)">+</button></span><b>'+money(i.price*i.qty)+'</b></div>').join('')||'<p class=muted>Empty</p>';grand.textContent=money(cart.reduce((s,i)=>s+i.price*i.qty,0))}function chg(n,v){cart[n].qty+=v;if(cart[n].qty<1)cart.splice(n,1);drawCart()}async function submitOrder(){if(!cart.length)return alert('Cart is empty');let o=await api('/orders',{method:'POST',body:JSON.stringify({items:cart,orderType:otype.value,table:table.value,paymentMethod:payment.value})});alert(o.number+' submitted');go('orders')}
async function orders(){let os=await api('/orders');view.innerHTML='<div class=top><h1>Live Orders</h1><button onclick=orders()>Refresh</button></div>'+os.map(o=>{let b='';if(me.role==='admin'&&['pending','awaiting_authorization'].includes(o.status))b='<button class=primary onclick="status(\''+o.id+'\',\'authorized\')">Authorize</button>';else if(me.role==='admin'&&o.status==='authorized')b='<button onclick="status(\''+o.id+'\',\'sent_to_kitchen\')">Send Kitchen</button>';else if(me.role==='kitchen'&&['sent_to_kitchen','authorized'].includes(o.status))b='<button onclick="status(\''+o.id+'\',\'preparing\')">Start Making</button>';else if(me.role==='kitchen'&&o.status==='preparing')b='<button class=primary onclick="status(\''+o.id+'\',\'ready\')">Ready</button>';else if(me.role==='cashier'&&o.status==='ready')b='<button class=primary onclick="status(\''+o.id+'\',\'paid\')">Collect Payment</button>';else if(me.role==='cashier'&&o.status==='paid')b='<button onclick="status(\''+o.id+'\',\'closed\')">Close</button>';return '<div class=order><div class=top><b>'+o.number+'</b><span class=badge>'+o.status+'</span></div><div>'+o.items.map(i=>i.name+' '+(i.variant||'')+' × '+i.qty).join(' · ')+'</div><p class=muted>'+o.orderType+' · '+(o.table||'')+' · '+new Date(o.createdAt).toLocaleString()+'</p><h3>'+money(o.total)+'</h3>'+b+' <button onclick="alert('+JSON.stringify(JSON.stringify(o.history))+')">History</button></div>'}).join('')||'<div class=panel>No orders</div>'}async function status(id,s){await api('/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})});orders()}
const labels={menu:'products',combos:'combos',recipes:'recipes',riders:'riders',staff:'users',customers:'customers',suppliers:'suppliers',expenses:'expenses',accounts:'accounts',demands:'demands',purchases:'purchases'};async function genericPage(key){let rows=await api('/'+labels[key]),title=key[0].toUpperCase()+key.slice(1);view.innerHTML='<div class=top><h1>'+title+'</h1><div class=actions><button class=primary onclick="addRecord(\''+key+'\')">＋ Add</button>'+(key==='menu'?'<button onclick=bulkImport()>⬆ Bulk Upload</button><button onclick=exportMenu()>⬇ Download</button><button class=danger onclick=bulkDelete()>Delete Selected</button>':'')+'</div></div><div class=panel><table class=table><thead><tr>'+(key==='menu'?'<th><input type=checkbox onchange="document.querySelectorAll(\'.pick\').forEach(x=>x.checked=this.checked)"></th>':'')+'<th>Record</th><th>Details</th><th>Created</th><th>Action</th></tr></thead><tbody>'+rows.map(r=>'<tr>'+(key==='menu'?'<td><input class=pick type=checkbox value="'+r.id+'"></td>':'')+'<td><b>'+String(r.name||r.title||r.item||r.productId||r.id)+'</b></td><td>'+JSON.stringify(r).slice(0,260)+'</td><td>'+String(r.createdAt||r.date||r.at||'')+'</td><td><button class=danger onclick="removeRecord(\''+labels[key]+'\',\''+r.id+'\')">Delete</button></td></tr>').join('')+'</tbody></table></div>'}for(const k of Object.keys(labels))window[k]=()=>genericPage(k);async function addRecord(key){let name=prompt('Name / item / title');if(!name)return;let body={name,title:name,item:name};if(key==='staff')Object.assign(body,{username:prompt('Username'),password:prompt('Password')||'change-me',role:prompt('Role','waiter')});if(key==='menu')Object.assign(body,{sku:prompt('SKU')||Date.now(),price:Number(prompt('Price','0')),category:prompt('Category','General'),unit:prompt('Unit','pcs'),stock:Number(prompt('Opening stock','0')),variants:[]});if(key==='expenses')body.amount=Number(prompt('Amount','0'));if(key==='riders'||key==='customers'||key==='suppliers')body.phone=prompt('Phone','');if(key==='demands')Object.assign(body,{qty:Number(prompt('Quantity','0')),unit:prompt('Unit','kg/pcs')});await api('/'+labels[key],{method:'POST',body:JSON.stringify(body)});genericPage(key)}async function removeRecord(k,id){if(confirm('Delete/deactivate?')){await api('/'+k+'/'+id,{method:'DELETE'});genericPage(Object.keys(labels).find(x=>labels[x]===k))}}async function bulkDelete(){let ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.value);if(!ids.length)return alert('Select items');for(const id of ids)await api('/products/'+id,{method:'DELETE'});menu()}function bulkImport(){let f=document.createElement('input');f.type='file';f.accept='.csv';f.onchange=()=>{let r=new FileReader();r.onload=async()=>{let rows=r.result.trim().split(/\r?\n/).slice(1).map(x=>{let a=x.split(',');return{name:a[0],sku:a[1],price:a[2],stock:a[3],unit:a[4],category:a[5]}});await api('/products/bulk',{method:'POST',body:JSON.stringify({rows})});menu()};r.readAsText(f.files[0])};f.click()}async function exportMenu(){let r=await fetch(API+'/products/export',{headers:{Authorization:'Bearer '+token}}),b=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mk-menu.csv';a.click()}
async function inventory(){let x=await api('/inventory');view.innerHTML='<div class=top><h1>Inventory & Recipe Cost</h1><button onclick=inventory()>Refresh</button></div><div class=panel><table class=table><tr><th>Item</th><th>Stock</th><th>Unit</th><th>Cost</th><th>Min</th></tr>'+x.map(p=>'<tr><td>'+p.name+'</td><td>'+p.stock+'</td><td>'+p.unit+'</td><td>'+money(p.recipeCost||p.cost)+'</td><td>'+p.minStock+'</td></tr>').join('')+'</table></div>'}async function production(){view.innerHTML='<div class=top><h1>Production / Yield</h1></div><div class=panel><p>Example: 100 kg raw meat → 70 kg usable meat → 30 kg loss.</p><div class=form><input id=material placeholder="Material" value="Meat"><input id=inputQty type=number placeholder="Raw input kg"><input id=outputQty type=number placeholder="Usable output kg"><button class=primary onclick=yieldSave()>Record Yield</button></div></div><div id=prodList class=panel style="margin-top:10px"></div>';let x=await api('/production');prodList.innerHTML=x.map(r=>'<div>'+r.date+' · '+r.material+' · '+r.inputQty+' → '+r.outputQty+' '+r.outputUnit+' · loss '+r.lossPercent+'%</div>').join('')}async function yieldSave(){await api('/production/yield',{method:'POST',body:JSON.stringify({material:material.value,inputQty:Number(inputQty.value),outputQty:Number(outputQty.value)})});production()}
async function analytics(){let x=await api('/analytics/items');view.innerHTML='<div class=top><h1>Item-Level Sales Analytics</h1><button onclick=analytics()>Refresh</button></div><div class=panel><p class=muted>Variants are tracked separately, including components recorded from combo/deal sales.</p><table class=table><tr><th>Item</th><th>Variant</th><th>Qty</th><th>Sales</th><th>Source</th></tr>'+x.sort((a,b)=>b.amount-a.amount).map(i=>'<tr><td>'+i.item+'</td><td>'+i.variant+'</td><td>'+i.qty+'</td><td>'+money(i.amount)+'</td><td>'+i.source+'</td></tr>').join('')+'</table></div>'}async function audit(){let x=await api('/audit');view.innerHTML='<h1>Audit Log</h1><div class=panel><table class=table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Detail</th></tr>'+x.map(a=>'<tr><td>'+a.at+'</td><td>'+a.user+'</td><td>'+a.action+'</td><td>'+a.entity+'</td><td>'+a.detail+'</td></tr>').join('')+'</table></div>'}async function settings(){let c=await api('/settings');view.innerHTML='<h1>Company Settings</h1><div class=panel><div class=form><input id=cn value="'+c.name+'"><input id=ca value="'+c.address+'"><input id=cp value="'+c.phone+'"><input id=ct type=number value="'+c.tax+'"><input id=cc value="'+c.currency+'"><button class=primary onclick=saveSettings()>Save</button></div></div>'}async function saveSettings(){await api('/settings',{method:'PUT',body:JSON.stringify({name:cn.value,address:ca.value,phone:cp.value,tax:Number(ct.value),currency:cc.value})});alert('Saved')}if(token&&me)shell();else login();
</script></body></html>
