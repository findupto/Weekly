<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weekly POS</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:24px}.side h1{margin:0 0 30px}.side button{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd5e1;padding:12px;border-radius:8px;cursor:pointer}.side button.active,.side button:hover{background:#243044;color:#fff}.main{padding:24px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 390px;gap:20px}.panel,.stat,.product{background:#fff;border:1px solid #e5e7eb;border-radius:12px}.panel{padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{padding:16px}.stat small{color:#64748b}.stat strong{display:block;font-size:25px;margin-top:7px}.search{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;margin-bottom:14px}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.product{padding:14px;cursor:pointer}.product:hover{border-color:#2563eb}.product b{display:block;margin-bottom:8px}.muted{color:#64748b;font-size:13px}.price{font-size:18px;font-weight:700}.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.qty button{border:1px solid #d1d5db;background:#fff;border-radius:6px;width:28px;height:28px}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:800;margin:18px 0}.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pay button,.checkout{border:0;padding:12px;border-radius:8px;cursor:pointer}.pay button{background:#e5e7eb}.pay button.selected{background:#111827;color:#fff}.checkout{width:100%;background:#2563eb;color:#fff;font-weight:700;margin-top:10px}.notice{margin:12px 0;padding:10px;border-radius:8px;background:#eef2ff}.hidden{display:none}@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body><div class="app"><aside class="side"><h1>Weekly POS</h1><button class="active">🛒 Sales</button><button onclick="showProducts()">📦 Products</button><button onclick="loadOrders()">🧾 Orders</button><button onclick="location.reload()">🔄 Refresh</button></aside><main class="main"><div class="top"><div><h2>Point of Sale</h2><span class="muted">Fast checkout • Mobile API ready</span></div></div><section class="stats"><div class="stat"><small>Sales today</small><strong id="sales">PKR 0</strong></div><div class="stat"><small>Orders today</small><strong id="orders">0</strong></div><div class="stat"><small>Products</small><strong id="count">0</strong></div><div class="stat"><small>Low stock</small><strong id="low">0</strong></div></section><div id="notice"></div><section class="grid"><div class="panel"><input id="search" class="search" placeholder="Search product or scan SKU..." oninput="renderProducts()"><div id="products" class="products"></div></div><div class="panel"><h3>Current Sale</h3><div id="cart"></div><div class="total"><span>Total</span><span id="total">PKR 0</span></div><div class="pay"><button class="selected" onclick="payment('cash',this)">Cash</button><button onclick="payment('card',this)">Card</button><button onclick="payment('mobile',this)">Mobile</button></div><button class="checkout" onclick="checkout()">Complete Sale</button></div></section><section id="ordersPanel" class="panel hidden" style="margin-top:20px"><h3>Recent Orders</h3><div id="orderList"></div></section></main></div>
<script>
const API='/api';let products=[],cart=[],method='cash';const money=n=>new Intl.NumberFormat('en-PK',{style:'currency',currency:'PKR',maximumFractionDigits:0}).format(n);
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function init(){products=await api('/products');renderProducts();const d=await api('/dashboard');sales.textContent=money(d.salesToday);orders.textContent=d.ordersToday;count.textContent=d.products;low.textContent=d.lowStock}function renderProducts(){const q=search.value.toLowerCase();products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q)).forEach;document.getElementById('products').innerHTML=products.filter(p=>(p.name+' '+p.sku+' '+p.category).toLowerCase().includes(q)).map(p=>`<div class="product" onclick="add('${p.id}')"><b>${p.name}</b><span class="muted">${p.sku} • ${p.stock} in stock</span><div class="price">${money(p.price)}</div></div>`).join('')}
function add(id){const p=products.find(x=>x.id===id);if(p.stock<1)return note('Out of stock');const x=cart.find(i=>i.productId===id);if(x){if(x.qty<p.stock)x.qty++;else return note('Not enough stock')}else cart.push({productId:id,qty:1});renderCart()}function renderCart(){cartEl=document.getElementById('cart');cartEl.innerHTML=cart.length?cart.map(i=>{const p=products.find(x=>x.id===i.productId);return `<div class="cart-row"><span>${p.name}<br><small>${money(p.price)}</small></span><span class="qty"><button onclick="change('${p.id}',-1)">−</button> ${i.qty} <button onclick="change('${p.id}',1)">+</button></span><b>${money(p.price*i.qty)}</b></div>`}).join(''):'<p class="muted">Tap products to add them to the sale.</p>';document.getElementById('total').textContent=money(cart.reduce((s,i)=>s+products.find(p=>p.id===i.productId).price*i.qty,0))}function change(id,n){const x=cart.find(i=>i.productId===id);x.qty+=n;if(x.qty<=0)cart=cart.filter(i=>i!==x);renderCart()}function payment(m,b){method=m;document.querySelectorAll('.pay button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')}async function checkout(){if(!cart.length)return note('Add products first');try{const o=await api('/orders',{method:'POST',body:JSON.stringify({items:cart,paymentMethod:method})});note(`Sale ${o.number} completed — ${money(o.total)}`);cart=[];products=await api('/products');renderProducts();renderCart();init()}catch(e){note(e.message)}}function note(t){document.getElementById('notice').innerHTML=`<div class="notice">${t}</div>`;setTimeout(()=>document.getElementById('notice').innerHTML='',3000)}async function loadOrders(){ordersPanel.classList.remove('hidden');const os=await api('/orders');orderList.innerHTML=os.slice(0,20).map(o=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${o.number}</b> — ${money(o.total)} <span class="muted">${new Date(o.createdAt).toLocaleString()}</span></div>`).join('')||'<p class="muted">No orders yet.</p>'}function showProducts(){ordersPanel.classList.add('hidden');search.focus()}init();renderCart();
</script></body></html>
