<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MK Pizza & Ice Bar POS</title><style>*{box-sizing:border-box}body{margin:0;font:14px Arial;background:#f4f6f8;color:#172033}button,input,select{font:inherit;padding:10px;border:1px solid #d5dbe5;border-radius:8px}button{cursor:pointer;font-weight:700}.primary{background:#d7194b;color:#fff;border-color:#d7194b}.login{min-height:100vh;display:grid;place-items:center}.box{width:min(420px,92vw);background:#fff;padding:28px;border-radius:16px;box-shadow:0 10px 40px #0002}.box input{width:100%;margin:6px 0}.muted{color:#68758a}.error{color:#b00020;white-space:pre-wrap}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#101827;color:#fff;padding:16px}.side button{display:block;width:100%;text-align:left;background:transparent;color:#dbe3ef;border:0;margin:3px 0}.main{padding:22px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.card,.panel{background:#fff;border:1px solid #e1e5eb;border-radius:12px;padding:15px}.card strong{display:block;font-size:22px;margin-top:6px}.order{background:#fff;border:1px solid #e1e5eb;border-radius:10px;padding:14px;margin:9px 0}.badge{padding:4px 8px;border-radius:20px;background:#eef2ff}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.product{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee}@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.main{padding:12px}}</style></head><body><div id="root"></div><script>(function(){'use strict';var root=document.getElementById('root'),token=localStorage.getItem('mkToken')||'',me=null,products=[],cart=[];try{me=JSON.parse(localStorage.getItem('mkUser')||'null')}catch(e){me=null}var API=(localStorage.getItem('mkApi')||'/api').replace(/\/$/,'');function esc(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function money(v){return 'Rs '+Number(v||0).toLocaleString('en-PK')}function api(path,opt){opt=opt||{};var h={'Content-Type':'application/json'};if(token)h.Authorization='Bearer '+token;return fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body}).then(function(r){return r.text().then(function(t){var d={};try{d=t?JSON.parse(t):{}}catch(e){d={error:t}}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d})})}function login(){root.innerHTML='<div class="login"><div class="box"><h1>MK Pizza & Ice Bar</h1><p class="muted">Restaurant Operating System</p><input id="u" value="admin" placeholder="Username"><input id="p" type="password" value="admin123" placeholder="Password"><button class="primary" id="login" style="width:100%">Sign In</button><p class="muted">Admin admin123 · Waiter waiter123 · Kitchen kitchen123 · Cashier cashier123</p><div id="err" class="error"></div></div></div>';document.getElementById('login').onclick=signin}function signin(){var b=document.getElementById('login');b.disabled=true;b.textContent='Signing in...';api('/login',{method:'POST',body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})}).then(function(d){token=d.token;me=d.user;localStorage.setItem('mkToken',token);localStorage.setItem('mkUser',JSON.stringify(me));shell()}).catch(function(e){document.getElementById('err').textContent=e.message;b.disabled=false;b.textContent='Sign In'})}function logout(){localStorage.removeItem('mkToken');localStorage.removeItem('mkUser');token='';me=null;login()}function shell(){var nav=[['home','Dashboard'],['orders','Live Orders']];if(me.role==='admin'||me.role==='waiter')nav.push(['pos','New Sale']);if(me.role==='admin')['menu','combos','recipes','inventory','production','demands','purchases','riders','staff','customers','suppliers','expenses','accounts','analytics','audit','settings'].forEach(function(x){nav.push([x,x.charAt(0).toUpperCase()+x.slice(1)])});root.innerHTML='<div class="app"><aside class="side"><h2>MK Pizza</h2><div class="muted">Ice Bar · Bhakkar</div><hr>'+nav.map(function(n){return '<button data-page="'+n[0]+'">'+n[1]+'</button>'}).join('')+'<hr><button id="logout">Logout</button></aside><main class="main" id="view"><div class="panel">Loading...</div></main></div>';document.getElementById('logout').onclick=logout;document.querySelectorAll('[data-page]').forEach(function(b){b.onclick=function(){go(b.dataset.page)}});go('home')}function go(p){document.getElementById('view').innerHTML='<div class="panel">Loading...</div>';pages[p]().catch(function(e){document.getElementById('view').innerHTML='<div class="panel"><h2>Unable to load</h2><div class="error">'+esc(e.message)+'</div><button onclick="go(\''+p+'\')">Retry</button></div>'})}function home(){return api('/dashboard').then(function(d){document.getElementById('view').innerHTML='<h1>Control Center</h1><p class="muted">'+esc(me.name)+' · '+esc(me.role)+'</p><div class="cards">'+[['Sales Today',money(d.salesToday)],['Orders',d.ordersToday],['Pending',d.pending],['Kitchen',d.kitchen],['Ready',d.ready],['Low Stock',d.lowStock]].map(function(x){return '<div class="card">'+x[0]+'<strong>'+x[1]+'</strong></div>'}).join('')+'</div><div class="panel"><h2>Automated Workflow</h2><p>Customer / Waiter → Admin → Kitchen → Preparing → Ready → Cashier → Paid → Closed.</p></div>'})}function orders(){return api('/orders').then(function(os){document.getElementById('view').innerHTML='<h1>Live Orders</h1>'+(os.length?os.map(function(o){var b='';if(me.role==='admin'&&(o.status==='pending'||o.status==='awaiting_authorization'))b='<button class="primary" onclick="setStatus(\''+o.id+'\',\'authorized\')">Authorize</button>';else if(me.role==='admin'&&o.status==='authorized')b='<button onclick="setStatus(\''+o.id+'\',\'sent_to_kitchen\')">Send Kitchen</button>';else if(me.role==='kitchen'&&(o.status==='authorized'||o.status==='sent_to_kitchen'))b='<button onclick="setStatus(\''+o.id+'\',\'preparing\')">Start Making</button>';else if(me.role==='kitchen'&&o.status==='preparing')b='<button class="primary" onclick="setStatus(\''+o.id+'\',\'ready\')">Ready</button>';else if(me.role==='cashier'&&o.status==='ready')b='<button class="primary" onclick="setStatus(\''+o.id+'\',\'paid\')">Collect Payment</button>';else if(me.role==='cashier'&&o.status==='paid')b='<button onclick="setStatus(\''+o.id+'\',\'closed\')">Close</button>';return '<div class="order"><b>'+esc(o.number)+'</b> <span class="badge">'+esc(o.status)+'</span><p>'+o.items.map(function(i){return esc(i.name)+' '+esc(i.variant||'')+' × '+i.qty}).join(' · ')+'</p><b>'+money(o.total)+'</b><p class="muted">'+esc(o.orderType)+' · '+esc(o.table||'')+'</p>'+b+'</div>'}).join(''):'<div class="panel">No orders.</div>')})}function setStatus(id,s){api('/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})}).then(function(){go('orders')}).catch(function(e){alert(e.message)})}function pos(){return api('/products').then(function(ps){products=ps;cart=[];document.getElementById('view').innerHTML='<h1>New Sale</h1><div class="panel"><input id="search" placeholder="Search menu" style="width:100%"><div id="plist" class="products" style="margin-top:10px"></div></div><div class="panel"><h2>Cart <span id="grand">Rs 0</span></h2><div id="cart"></div><select id="otype"><option value="dine-in">Dine-in</option><option value="takeaway">Takeaway</option><option value="delivery">Delivery</option></select><input id="table" placeholder="Table / customer / address"><button class="primary" onclick="submitSale()">Send for Authorization</button></div>';document.getElementById('search').oninput=drawProducts;drawProducts();drawCart()})}function drawProducts(){var q=document.getElementById('search').value.toLowerCase();document.getElementById('plist').innerHTML=products.filter(function(p){return JSON.stringify(p).toLowerCase().indexOf(q)>=0}).map(function(p){var v=(p.variants||[]).map(function(x){return '<button onclick="addItem(\''+p.id+'\',\''+String(x.name).replace(/'/g,"\\'")+'\','+Number(x.price)+')">'+esc(x.name)+' '+money(x.price)+'</button>'}).join(' ');return '<div class="product"><b>'+esc(p.name)+'</b><p class="muted">'+esc(p.category)+' · stock '+p.stock+'</p>'+v+' <button onclick="addItem(\''+p.id+'\',null,'+Number(p.price)+')">Standard '+money(p.price)+'</button></div>'}).join('')||'<p>No products.</p>'}function addItem(id,v,p){var x=cart.find(function(i){return i.productId===id&&i.variant===v});if(x)x.qty++;else cart.push({productId:id,variant:v,price:p,qty:1});drawCart()}function drawCart(){document.getElementById('cart').innerHTML=cart.map(function(x,i){var p=products.find(function(z){return z.id===x.productId});return '<div class="row"><span>'+esc(p?p.name:x.productId)+' '+esc(x.variant||'')+' × '+x.qty+'</span><span>'+money(x.price*x.qty)+' <button onclick="chg('+i+',-1)">−</button><button onclick="chg('+i+',1)">+</button></span></div>'}).join('')||'<p class="muted">Cart empty</p>';document.getElementById('grand').textContent=money(cart.reduce(function(s,x){return s+x.price*x.qty},0))}function chg(i,n){cart[i].qty+=n;if(cart[i].qty<1)cart.splice(i,1);drawCart()}function submitSale(){if(!cart.length)return alert('Cart empty');api('/orders',{method:'POST',body:JSON.stringify({items:cart,orderType:document.getElementById('otype').value,table:document.getElementById('table').value})}).then(function(o){alert(o.number+' submitted');go('orders')}).catch(function(e){alert(e.message)})}function generic(k){var routes={menu:'products',combos:'combos',recipes:'recipes',riders:'riders',staff:'users',customers:'customers',suppliers:'suppliers',expenses:'expenses',accounts:'accounts',demands:'demands',purchases:'purchases'};return api('/'+routes[k]).then(function(rows){document.getElementById('view').innerHTML='<h1>'+esc(k)+'</h1><div class="panel"><button class="primary" onclick="addRecord(\''+k+'\')">Add</button><table class="table"><tr><th>Name</th><th>Details</th></tr>'+rows.map(function(r){return '<tr><td>'+esc(r.name||r.title||r.item||r.id)+'</td><td>'+esc(JSON.stringify(r).slice(0,220))+'</td></tr>'}).join('')+'</table></div>'})}function addRecord(k){var routes={menu:'products',combos:'combos',recipes:'recipes',riders:'riders',staff:'users',customers:'customers',suppliers:'suppliers',expenses:'expenses',accounts:'accounts',demands:'demands',purchases:'purchases'},name=prompt('Name / item');if(!name)return;api('/'+routes[k],{method:'POST',body:JSON.stringify({name:name,title:name,item:name})}).then(function(){generic(k)}).catch(function(e){alert(e.message)})}function inventory(){return api('/inventory').then(function(x){document.getElementById('view').innerHTML='<h1>Inventory</h1><div class="panel">'+x.map(function(p){return '<p>'+esc(p.name)+' — '+p.stock+' '+esc(p.unit)+'</p>'}).join('')+'</div>'})}function production(){return api('/production').then(function(x){document.getElementById('view').innerHTML='<h1>Production / Yield</h1><div class="panel"><p>100 kg raw meat → 70 kg usable → 30 kg loss.</p><input id="mat" value="Meat"><input id="inq" type="number" placeholder="Raw kg"><input id="outq" type="number" placeholder="Usable kg"><button class="primary" onclick="yieldSave()">Record</button>'+x.map(function(r){return '<p>'+esc(r.material)+': '+r.inputQty+' → '+r.outputQty+'; loss '+r.lossPercent+'%</p>'}).join('')+'</div>'})}function yieldSave(){api('/production/yield',{method:'POST',body:JSON.stringify({material:document.getElementById('mat').value,inputQty:Number(document.getElementById('inq').value),outputQty:Number(document.getElementById('outq').value)})}).then(function(){production()}).catch(function(e){alert(e.message)})}function analytics(){return api('/analytics/items').then(function(x){document.getElementById('view').innerHTML='<h1>Item Sales Analytics</h1><div class="panel">'+x.map(function(r){return '<p>'+esc(r.item)+' / '+esc(r.variant)+' — '+r.qty+' — '+money(r.amount)+'</p>'}).join('')+'</div>'})}function audit(){return api('/audit').then(function(x){document.getElementById('view').innerHTML='<h1>Audit Log</h1><div class="panel">'+x.map(function(r){return '<p>'+esc(r.at)+' · '+esc(r.user)+' · '+esc(r.action)+'</p>'}).join('')+'</div>'})}function settings(){return api('/settings').then(function(c){document.getElementById('view').innerHTML='<h1>Company Settings</h1><div class="panel"><p>Name: '+esc(c.name)+'</p><p>Address: '+esc(c.address)+'</p><p>Phone: '+esc(c.phone)+'</p><p>Tax: '+c.tax+' · Currency: '+esc(c.currency)+'</p></div>'})}var pages={home:home,orders:orders,pos:pos,menu:function(){return generic('menu')},combos:function(){return generic('combos')},recipes:function(){return generic('recipes')},inventory:inventory,production:production,demands:function(){return generic('demands')},purchases:function(){return generic('purchases')},riders:function(){return generic('riders')},staff:function(){return generic('staff')},customers:function(){return generic('customers')},suppliers:function(){return generic('suppliers')},expenses:function(){return generic('expenses')},accounts:function(){return generic('accounts')},analytics:analytics,audit:audit,settings:settings};window.go=go;window.setStatus=setStatus;window.addItem=addItem;window.chg=chg;window.submitSale=submitSale;window.addRecord=addRecord;window.yieldSave=yieldSave;if(token&&me)shell();else login()})();</script></body></html>
