<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Order Online · MK Pizza & Ice Bar</title><style>body{font:15px Arial;margin:0;background:#f5f6f8;color:#172033}.wrap{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 340px;gap:14px}.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.card{background:#fff;padding:14px;border:1px solid #ddd;border-radius:12px}button,input,select{padding:10px;border:1px solid #ddd;border-radius:8px}button{cursor:pointer}.primary{background:#d7194b;color:white;border-color:#d7194b}.row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eee}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class=wrap><h1>MK Pizza & Ice Bar</h1><p>Abbas Chowk Collage Road Bhakkar · 0316 9700025</p><div class=grid><main><input id=q placeholder="Search menu" oninput=draw() style="width:100%;margin-bottom:10px"><div id=list class=items></div></main><aside class=card><h2>Your Order</h2><div id=cart></div><input id=name placeholder="Name" style="width:100%;margin:4px 0"><input id=phone placeholder="Phone" style="width:100%;margin:4px 0"><textarea id=address placeholder="Delivery address" style="width:100%;margin:4px 0"></textarea><select id=type style="width:100%;margin:4px 0"><option value=delivery>Delivery</option><option value=takeaway>Takeaway</option><option value=dine-in>Dine-in</option></select><button class=primary style="width:100%" onclick=send()>Place Order</button><p id=msg></p></aside></div></div><script>const A='/api';let ps=[],c=[];const money=n=>'Rs '+Number(n).toLocaleString('en-PK');async function load(){ps=await fetch(A+'/products').then(r=>r.json());draw()}function draw(){let q=(document.getElementById('q').value||'').toLowerCase();list.innerHTML=ps.filter(p=>JSON.stringify(p).toLowerCase().includes(q)).map(p=>'<div class=card><b>'+p.name+'</b><p>'+p.category+'</p>'+((p.variants||[]).length?(p.variants||[]).map(v=>'<button onclick="add(\''+p.id+'\',\''+v.name.replaceAll("'","\\'")+'\','+v.price+')">'+v.name+' '+money(v.price)+'</button> ').join(''):'<button onclick="add(\''+p.id+'\',null,'+p.price+')">Add '+money(p.price)+'</button>')+'</div>').join('')}function add(id,v,p){let x=c.find(i=>i.id===id&&i.v===v);if(x)x.qty++;else c.push({id,v,p,qty:1});drawCart()}function drawCart(){cart.innerHTML=c.map((x,n)=>'<div class=row><span>'+ps.find(p=>p.id===x.id).name+' '+(x.v||'')+' × '+x.qty+'</span><b>'+money(x.p*x.qty)+'</b></div>').join('')||'<p>Cart empty</p>'}async function send(){if(!c.length)return msg.textContent='Add items first';try{let d=await fetch(A+'/online/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items:c.map(x=>({productId:x.id,variant:x.v,price:x.p,qty:x.qty}),),orderType:type.value,customer:{name:name.value,phone:phone.value},phone:phone.value,address:address.value})}).then(r=>r.json());if(d.error)throw Error(d.error);msg.textContent='Order '+d.orderNumber+' received. It is waiting for restaurant confirmation.';c=[];drawCart()}catch(e){msg.textContent=e.message}}load();</script></body></html>
